# .github/workflows/dispatch.yml
#
# On push to main/working, send a repository_dispatch to the build repo
# (x13-me/flake-build-action). That workflow checks out this repo at the pushed
# SHA, enumerates every buildable flake output via scripts/generate-matrix.sh
# (packages/devShells/checks for x86_64-linux + aarch64-linux), builds them, and
# pushes the closures to cache.x13.me.
#
# Required on this repo:
#   variable  BUILD_REPO    e.g. "x13-me/flake-build-action"
#   secret    DISPATCH_PAT  PAT able to POST dispatches to BUILD_REPO

name: Dispatch Nix Build

on:
  push:
    branches:
      - main
      - working

jobs:
  dispatch:
    name: Trigger build in ${{ vars.BUILD_REPO }}
    runs-on: ubuntu-24.04

    steps:
      - name: Send repository_dispatch
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg ref  "${{ github.sha }}" \
            '{
              event_type: "nix-build",
              client_payload: { repo: $repo, ref: $ref }
            }')

          curl --fail-with-body -sSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ vars.BUILD_REPO }}/dispatches" \
            -d "$payload"
